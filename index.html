<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE Dragon Egg Hoard · preview</title>
<link rel="stylesheet" href="fonts.css"><style>html,body{margin:0;background:#1d2128;color:#efe8d8;font:15px Inter,system-ui,sans-serif}main{display:flex;gap:24px;padding:20px;align-items:flex-start;flex-wrap:wrap}canvas{width:400px;height:440px;background:#2e343c;border-radius:8px}button{font:600 14px Inter;padding:9px 14px;margin:0 6px 6px 0;border-radius:9px;border:1px solid #46a088;background:#1f4a3f;color:#f4efe2;cursor:pointer}h1{font:600 22px Fraunces,serif;color:#d1ad66;margin:0 0 8px}</style></head>
<body><main><canvas id="c" width="1000" height="1100"></canvas><div><h1>EXE Dragon Egg Hoard</h1><p>Preview v1.0.0-rc.1 · nothing here is saved.</p>
<button onclick="go('!hoard give viewer'+(n++%4)+' 1')">Open an egg</button><button onclick="go('!hoard rain 20')">Egg rain</button><button onclick="go('!collection viewer0')">Collection</button><p id="v"></p></div></main>
<script src="engine/egghoard-presenter.js"></script><script src="engine/egghoard-engine.js"></script>
<script>let n=0,BB=null;const go=t=>BB&&BB.onChat('streamer',t,{roles:{broadcaster:true}});
(async()=>{const theme=await (await fetch('theme/theme.json')).json();try{await Promise.all([document.fonts.load('600 40px Fraunces'),document.fonts.load('600 20px Inter'),document.fonts.load('700 20px Inter')]);}catch(e){}
BB=BlindBox.create({canvas:document.getElementById('c'),config:{theme,themeBase:'theme/',openCmd:'!hatch',craftCmd:'!forge',modCmd:'!hoard',sound:false,community:true}});await BB.READY;document.getElementById('v').textContent='engine '+BlindBox.VERSION+' · presenter '+BlindBoxPresenters.eggHoard.VERSION;})();</script></body></html>
